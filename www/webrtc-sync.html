<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebRTC 同步 - go2rtc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="viewer-body">
<header class="viewer-bar">
    <a class="brand" href="index.html" aria-label="go2rtc 首页">
        <span class="brand-mark">g2</span>
        <span>go2rtc</span>
    </a>
    <div class="viewer-title">
        <strong id="viewer-name">WebRTC 同步</strong>
        <span id="viewer-meta">正在连接…</span>
    </div>
    <div class="spacer"></div>
    <a class="btn btn-primary btn-sm" href="index.html">返回</a>
</header>

<main class="viewer-stage single">
    <video id="video" autoplay controls playsinline muted></video>
</main>
<script>
    const params = new URLSearchParams(location.search);
    const streamName = params.get('src') || params.get('dst');
    const nameEl = document.getElementById('viewer-name');
    const metaEl = document.getElementById('viewer-meta');

    if (streamName) {
        nameEl.textContent = streamName;
        document.title = streamName + ' WebRTC 同步 - go2rtc';
    }

    async function PeerConnection(media) {
        const pc = new RTCPeerConnection({
            iceServers: [{urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302']}]
        });

        document.getElementById('video').srcObject = new MediaStream([
            pc.addTransceiver('audio', {direction: 'sendrecv'}).receiver.track,
            pc.addTransceiver('video', {direction: 'sendrecv'}).receiver.track,
        ]);

        const tracks = await navigator.mediaDevices.getUserMedia({
            video: media.indexOf('camera') >= 0,
            audio: media.indexOf('microphone') >= 0,
        });
        tracks.getTracks().forEach(track => pc.addTrack(track));

        return pc;
    }

    function getCompleteOffer(pc, timeout) {
        return new Promise((resolve, reject) => {
            pc.addEventListener('icegatheringstatechange', () => {
                if (pc.iceGatheringState === 'complete') resolve(pc.localDescription.sdp);
            });

            pc.createOffer().then(offer => pc.setLocalDescription(offer));

            setTimeout(() => resolve(pc.localDescription.sdp), timeout || 3000);
        });
    }

    async function connect() {
        const media = params.get('media') || 'video+audio';
        metaEl.textContent = media.replaceAll('+', ' · ');
        const pc = await PeerConnection(media);
        const url = new URL('api/webrtc' + location.search, location.href);
        const response = await fetch(url, {method: 'POST', body: await getCompleteOffer(pc)});
        await pc.setRemoteDescription({type: 'answer', sdp: await response.text()});

        pc.addEventListener('connectionstatechange', () => {
            metaEl.textContent = pc.connectionState;
        });
    }

    connect().catch(error => {
        console.error(error);
        metaEl.textContent = String(error.message || error);
    });
</script>
</body>
</html>
