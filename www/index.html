<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流列表 - go2rtc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<script src="main.js"></script>

<main class="page">
    <section class="page-header">
        <div class="page-header-copy">
            <span class="eyebrow">控制台</span>
            <h1>流列表</h1>
            <p class="page-subtitle">在一个页面中打开、查看和管理所有摄像头源。</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-secondary" href="add.html">添加源</a>
            <button class="btn btn-primary" id="play-selected" type="button">播放所选</button>
        </div>
    </section>

    <section class="card toolbar" aria-label="Stream controls">
        <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
            </svg>
            <input class="input" id="search" type="search" placeholder="搜索流" autocomplete="off">
        </label>

        <div class="toolbar-group">
            <span class="toolbar-label">模式</span>
            <label class="chip"><input type="checkbox" name="webrtc" checked><span class="chip-dot"></span>WebRTC</label>
            <label class="chip"><input type="checkbox" name="mse" checked><span class="chip-dot"></span>MSE</label>
            <label class="chip"><input type="checkbox" name="hls" checked><span class="chip-dot"></span>HLS</label>
            <label class="chip"><input type="checkbox" name="mjpeg" checked><span class="chip-dot"></span>MJPEG</label>
        </div>

        <div class="spacer"></div>

        <label class="checkbox"><input id="selectall" type="checkbox">全选</label>
        <button class="icon-btn" id="refresh" type="button" title="刷新流列表" aria-label="刷新流列表">↻</button>
    </section>

    <section class="card stream-panel">
        <div class="section-head">
            <div>
                <h2>全部流</h2>
                <p id="stream-count">加载中…</p>
            </div>
            <div class="toolbar-group">
                <span class="badge"><span class="status-dot online"></span><span id="online-count">0 online</span></span>
                <span class="badge">自动刷新</span>
            </div>
        </div>

        <div class="stream-list" id="streams"></div>

        <div class="empty-state" id="empty" hidden>
            <div class="empty-icon">◎</div>
            <strong>暂无流</strong>
            <p>添加摄像头 URL 或发现设备以开始推流。</p>
            <a class="btn btn-primary btn-sm" href="add.html">添加第一个源</a>
        </div>
    </section>

    <footer class="page-footer">
        <span id="info">go2rtc</span>
        <span>每 2 秒自动更新</span>
    </footer>
</main>

<dialog class="dialog" id="delete-dialog">
    <form method="dialog">
        <div class="dialog-body">
            <h3>删除流</h3>
            <p>此操作会从配置中移除此流，且无法撤销。请输入 <strong id="delete-name"></strong> 以确认。</p>
            <label class="field">
                <span>流名称</span>
                <input class="input" id="delete-confirm" type="text" autocomplete="off" spellcheck="false">
            </label>
            <div class="dialog-error" id="delete-error"></div>
        </div>
        <div class="dialog-actions">
            <button class="btn btn-ghost" value="cancel" type="submit">取消</button>
            <button class="btn btn-danger" id="delete-confirm-btn" value="confirm" type="button">删除流</button>
        </div>
    </form>
</dialog>

<script>
    const tbody = document.getElementById('streams');
    const empty = document.getElementById('empty');
    const searchInput = document.getElementById('search');
    const selectAll = document.getElementById('selectall');
    const countLabel = document.getElementById('stream-count');
    const onlineLabel = document.getElementById('online-count');
    const refreshBtn = document.getElementById('refresh');
    const playBtn = document.getElementById('play-selected');
    const dialog = document.getElementById('delete-dialog');
    const deleteName = document.getElementById('delete-name');
    const deleteConfirm = document.getElementById('delete-confirm');
    const deleteError = document.getElementById('delete-error');
    const deleteConfirmBtn = document.getElementById('delete-confirm-btn');

    const rows = new Map();
    const selected = new Set();
    let pendingDelete = null;

    const enc = encodeURIComponent;

    function getModes() {
        return Array.from(document.querySelectorAll('.chip input:checked'), input => input.name);
    }

    function applyFilter() {
        const query = searchInput.value.trim().toLowerCase();

        rows.forEach((row, name) => {
            const visible = !query || name.toLowerCase().includes(query);
            row.hidden = !visible;
            if (!visible) row.classList.remove('is-selected');
        });

        const visible = Array.from(rows.values()).filter(row => !row.hidden);
        visible.forEach(row => row.classList.toggle('is-selected', selected.has(row.dataset.name)));
        updateSelectAllState();
    }

    function updateSelectAllState() {
        const visible = Array.from(rows.values()).filter(row => !row.hidden);
        const selectedVisible = visible.filter(row => selected.has(row.dataset.name)).length;

        selectAll.checked = visible.length > 0 && selectedVisible === visible.length;
        selectAll.indeterminate = selectedVisible > 0 && selectedVisible < visible.length;
    }

    function makeRow(name) {
        const row = document.createElement('div');
        row.className = 'stream-row';
        row.dataset.name = name;

        const check = document.createElement('label');
        check.className = 'stream-check';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.name = name;
        checkbox.checked = selected.has(name);
        checkbox.setAttribute('aria-label', `选择 ${name}`);
        check.appendChild(checkbox);

        const info = document.createElement('div');
        info.className = 'stream-info';

        const title = document.createElement('div');
        title.className = 'stream-title';
        const dot = document.createElement('span');
        dot.className = 'status-dot';
        const nameEl = document.createElement('span');
        nameEl.className = 'stream-name';
        nameEl.textContent = name;
        const badge = document.createElement('span');
        badge.className = 'badge';
        title.append(dot, nameEl, badge);

        const meta = document.createElement('div');
        meta.className = 'stream-meta';

        info.append(title, meta);

        const actions = document.createElement('div');
        actions.className = 'stream-actions';

        const play = document.createElement('a');
        play.className = 'btn btn-secondary';
        play.textContent = '播放';
        play.href = `stream.html?src=${enc(name)}`;

        const links = document.createElement('a');
        links.className = 'icon-btn';
        links.textContent = '链接';
        links.title = '打开流链接';
        links.href = `links.html?src=${enc(name)}`;

        const infoLink = document.createElement('a');
        infoLink.className = 'icon-btn';
        infoLink.textContent = '信息';
        infoLink.title = '流信息';
        infoLink.href = `api/streams?src=${enc(name)}`;

        const net = document.createElement('a');
        net.className = 'icon-btn';
        net.textContent = '网络';
        net.title = '网络拓扑';
        net.href = `net.html?src=${enc(name)}`;

        const del = document.createElement('button');
        del.className = 'icon-btn';
        del.type = 'button';
        del.textContent = '删除';
        del.title = '删除流';
        del.dataset.delete = name;

        actions.append(play, links, infoLink, net, del);

        row.append(check, info, actions);

        checkbox.addEventListener('change', () => {
            if (checkbox.checked) selected.add(name);
            else selected.delete(name);
            row.classList.toggle('is-selected', checkbox.checked);
            updateSelectAllState();
        });

        return row;
    }

    function updateRow(row, value) {
        const consumers = value && Array.isArray(value.consumers) ? value.consumers.length : 0;
        const producers = value && Array.isArray(value.producers) ? value.producers : [];
        const name = row.dataset.name;
        const dot = row.querySelector('.status-dot');
        const badge = row.querySelector('.badge');
        const meta = row.querySelector('.stream-meta');

        dot.classList.toggle('online', consumers > 0);
        badge.className = 'badge' + (consumers > 0 ? ' badge-online' : '');
        badge.textContent = consumers > 0 ? consumers + ' 个观看者' : '空闲';

        const source = producers.map(producer => producer && producer.url).find(Boolean);
        const sourceCount = producers.length;

        meta.textContent = '';
        const countText = document.createTextNode(`${sourceCount} 个源`);
        meta.appendChild(countText);

        if (source) {
            const separator = document.createTextNode('  ·  ');
            const sourceEl = document.createElement('span');
            sourceEl.className = 'mono';
            sourceEl.textContent = source;
            meta.append(separator, sourceEl);
        }

        const linkBase = enc(name);
        const anchors = row.querySelectorAll('.stream-actions a');
        anchors[0].href = `stream.html?src=${linkBase}`;
        anchors[1].href = `links.html?src=${linkBase}`;
        anchors[2].href = `api/streams?src=${linkBase}`;
        anchors[3].href = `net.html?src=${linkBase}`;
        row.querySelector('[data-delete]').dataset.delete = name;
    }

    async function reload() {
        try {
            const response = await fetch('api/streams', {cache: 'no-cache'});
            if (!response.ok) throw new Error(await response.text());
            const data = await response.json();

            const names = Object.keys(data);
            let online = 0;

            const seen = new Set(names);

            for (const name of names) {
                let row = rows.get(name);
                if (!row) {
                    row = makeRow(name);
                    rows.set(name, row);
                    tbody.appendChild(row);
                }
                updateRow(row, data[name]);
                const viewers = data[name] && Array.isArray(data[name].consumers) ? data[name].consumers.length : 0;
                if (viewers > 0) online++;
            }

            for (const [name, row] of rows) {
                if (!seen.has(name)) {
                    row.remove();
                    rows.delete(name);
                    selected.delete(name);
                }
            }

            countLabel.textContent = `${names.length} 个流`;
            onlineLabel.textContent = `${online} 个在线`;
            empty.hidden = names.length > 0;
            tbody.hidden = names.length === 0;

            applyFilter();
            updateSelectAllState();
        } catch (error) {
            countLabel.textContent = '加载流列表失败';
            console.error('加载流列表失败:', error);
        }
    }

    playBtn.addEventListener('click', () => {
        const names = Array.from(selected);
        if (!names.length) {
            toast('请至少选择一个要播放的流。', 'error');
            return;
        }

        const url = new URL('stream.html', location.href);
        names.forEach(name => url.searchParams.append('src', name));

        const modes = getModes();
        if (modes.length) url.searchParams.set('mode', modes.join(','));

        location.href = url.toString();
    });

    selectAll.addEventListener('change', () => {
        rows.forEach((row, name) => {
            if (row.hidden) return;
            if (selectAll.checked) selected.add(name);
            else selected.delete(name);
            row.querySelector('input[type="checkbox"]').checked = selectAll.checked;
            row.classList.toggle('is-selected', selectAll.checked);
        });
        updateSelectAllState();
    });

    searchInput.addEventListener('input', applyFilter);

    document.addEventListener('keydown', event => {
        if (event.key === '/' && document.activeElement !== searchInput) {
            event.preventDefault();
            searchInput.focus();
        }
    });

    refreshBtn.addEventListener('click', reload);

    function openDelete(name) {
        pendingDelete = name;
        deleteName.textContent = name;
        deleteConfirm.value = '';
        deleteError.textContent = '';
        dialog.showModal();
        setTimeout(() => deleteConfirm.focus(), 50);
    }

    tbody.addEventListener('click', event => {
        const button = event.target.closest('[data-delete]');
        if (!button) return;
        openDelete(button.dataset.delete);
    });

    deleteConfirm.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
            event.preventDefault();
            deleteConfirmBtn.click();
        }
    });

    deleteConfirmBtn.addEventListener('click', async () => {
        if (!pendingDelete) return;
        const value = deleteConfirm.value.trim();

        if (value !== pendingDelete) {
            deleteError.textContent = '流名称不匹配。';
            return;
        }

        const name = pendingDelete;
        deleteConfirmBtn.disabled = true;

        try {
            const url = new URL('api/streams', location.href);
            url.searchParams.set('src', name);
            const response = await fetch(url, {method: 'DELETE'});

            if (!response.ok) throw new Error((await response.text()) || '删除失败');

            selected.delete(name);
            dialog.close();
            toast(`已删除 “${name}”。`, 'success');
            await reload();
        } catch (error) {
            deleteError.textContent = String(error.message || error);
        } finally {
            deleteConfirmBtn.disabled = false;
            pendingDelete = null;
        }
    });

    dialog.addEventListener('close', () => {
        pendingDelete = null;
    });

    const infoUrl = new URL('api', location.href);
    fetch(infoUrl, {cache: 'no-cache'}).then(r => r.json()).then(data => {
        const parts = [];
        if (data.version) parts.push(`版本 ${data.version}`);
        if (data.config_path) parts.push(data.config_path);
        document.getElementById('info').textContent = parts.join('  ·  ') || 'go2rtc';
    }).catch(() => {});

    reload();
    setInterval(reload, 2000);
</script>

</body>
</html>
