<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="https://go2rtc.org/icons/apple-touch-icon-180x180.png" sizes="180x180">
    <link rel="icon" href="https://go2rtc.org/icons/favicon.ico">
    <link rel="manifest" href="https://go2rtc.org/manifest.json">
    <title>流播放 - go2rtc</title>
</head>
<body class="viewer-body">
<header class="viewer-bar">
    <a class="brand" href="index.html" aria-label="go2rtc 首页">
        <span class="brand-mark">g2</span>
        <span>go2rtc</span>
    </a>
    <div class="viewer-title">
        <strong id="viewer-name">流</strong>
        <span id="viewer-meta">正在连接…</span>
    </div>
    <div class="spacer"></div>
    <a class="btn btn-secondary btn-sm" id="viewer-links" href="index.html">链接</a>
    <a class="btn btn-primary btn-sm" href="index.html">返回</a>
</header>

<main class="viewer-stage single" id="stage"></main>

<script type="module" src="./video-stream.js"></script>
<script type="module">
    const params = new URLSearchParams(location.search);

    // support multiple streams and multiple modes
    const streams = params.getAll('src');
    const modes = params.getAll('mode');
    if (modes.length === 0) modes.push('');

    while (modes.length > streams.length) {
        streams.push(streams[0]);
    }
    while (streams.length > modes.length) {
        modes.push(modes[0]);
    }

    const stage = document.getElementById('stage');
    const background = params.get('background') !== 'false';
    const width = params.get('width');

    if (streams.length > 1) {
        stage.classList.remove('single');
    }

    if (width) {
        stage.style.setProperty('--viewer-width', width);
    }

    for (let i = 0; i < streams.length; i++) {
        /** @type {VideoStream} */
        const video = document.createElement('video-stream');
        video.background = background;
        video.mode = modes[i] || video.mode;
        video.src = new URL('api/ws?src=' + encodeURIComponent(streams[i]), location.href);
        stage.appendChild(video);
    }

    document.getElementById('viewer-name').textContent = streams.join(' / ') || '流';
    document.getElementById('viewer-meta').textContent = modes.filter(Boolean).join(' · ') || '自动选择模式';
    document.getElementById('viewer-links').href = `links.html?src=${encodeURIComponent(streams[0] || '')}`;
    document.title = streams.join('/') + ' - 流播放 - go2rtc';
</script>
</body>
</html>
