<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebRTC 播放 - go2rtc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="viewer-body">
<header class="viewer-bar">
    <a class="brand" href="index.html" aria-label="go2rtc 首页">
        <span class="brand-mark">g2</span>
        <span>go2rtc</span>
    </a>
    <div class="viewer-title">
        <strong id="viewer-name">WebRTC 流</strong>
        <span id="viewer-meta">正在连接…</span>
    </div>
    <div class="spacer"></div>
    <a class="btn btn-primary btn-sm" href="index.html">返回</a>
</header>

<main class="viewer-stage single">
    <video id="video" autoplay controls playsinline muted></video>
</main>
<script>
    const media = new URLSearchParams(location.search).get('media') || 'video+audio';
    const params = new URLSearchParams(location.search);
    const streamName = params.get('src') || params.get('dst');
    const nameEl = document.getElementById('viewer-name');
    const metaEl = document.getElementById('viewer-meta');

    if (streamName) {
        nameEl.textContent = streamName;
        document.title = streamName + ' WebRTC 播放 - go2rtc';
    }
    metaEl.textContent = media.replaceAll('+', ' · ');

    async function PeerConnection(media) {
        const pc = new RTCPeerConnection({
            iceServers: [{urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302']}]
        });

        const localTracks = [];

        if (/camera|microphone/.test(media)) {
            const tracks = await getMediaTracks('user', {
                video: media.indexOf('camera') >= 0,
                audio: media.indexOf('microphone') >= 0,
            });
            tracks.forEach(track => {
                pc.addTransceiver(track, {direction: 'sendonly'});
                if (track.kind === 'video') localTracks.push(track);
            });
        }

        if (media.indexOf('display') >= 0) {
            const tracks = await getMediaTracks('display', {
                video: true,
                audio: media.indexOf('speaker') >= 0,
            });
            tracks.forEach(track => {
                pc.addTransceiver(track, {direction: 'sendonly'});
                if (track.kind === 'video') localTracks.push(track);
            });
        }

        if (/video|audio/.test(media)) {
            const tracks = ['video', 'audio']
                .filter(kind => media.indexOf(kind) >= 0)
                .map(kind => pc.addTransceiver(kind, {direction: 'recvonly'}).receiver.track);
            localTracks.push(...tracks);
        }

        document.getElementById('video').srcObject = new MediaStream(localTracks);

        return pc;
    }

    async function getMediaTracks(media, constraints) {
        try {
            const stream = media === 'user'
                ? await navigator.mediaDevices.getUserMedia(constraints)
                : await navigator.mediaDevices.getDisplayMedia(constraints);
            return stream.getTracks();
        } catch (e) {
            console.warn(e);
            metaEl.textContent = '无法获取权限：' + media;
            return [];
        }
    }

    async function connect(media) {
        const pc = await PeerConnection(media);
        const url = new URL('api/ws' + location.search, location.href);
        const ws = new WebSocket('ws' + url.toString().substring(4));

        ws.addEventListener('open', () => {
            metaEl.textContent = '正在协商 WebRTC…';

            pc.addEventListener('icecandidate', ev => {
                if (!ev.candidate) return;
                const msg = {type: 'webrtc/candidate', value: ev.candidate.candidate};
                ws.send(JSON.stringify(msg));
            });

            pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
                const msg = {type: 'webrtc/offer', value: pc.localDescription.sdp};
                ws.send(JSON.stringify(msg));
            });
        });

        pc.addEventListener('connectionstatechange', () => {
            metaEl.textContent = pc.connectionState;
        });

        ws.addEventListener('message', ev => {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'webrtc/candidate') {
                pc.addIceCandidate({candidate: msg.value, sdpMid: '0'});
            } else if (msg.type === 'webrtc/answer') {
                pc.setRemoteDescription({type: 'answer', sdp: msg.value});
            }
        });

        ws.addEventListener('close', () => {
            metaEl.textContent = '已断开';
        });
    }

    connect(media).catch(error => {
        console.error(error);
        metaEl.textContent = String(error.message || error);
    });
</script>
</body>
</html>
